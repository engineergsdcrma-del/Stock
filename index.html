<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>ระบบสต๊อกสินค้า</title>

<style>

body{
font-family:Arial;
margin:20px;
}

input{
padding:8px;
margin:5px;
}

button{
padding:8px 15px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border:1px solid #ddd;
padding:8px;
}

th{
background:#2196f3;
color:white;
}

</style>

</head>

<body>

<h1>📦 ระบบสต๊อกสินค้า</h1>

<h3>เพิ่มสินค้า</h3>

<input id="code" placeholder="รหัสสินค้า">
<input id="name" placeholder="ชื่อสินค้า">
<input id="qty" placeholder="จำนวน">
<input id="unit" placeholder="หน่วย">
<input id="user" placeholder="ผู้เบิก">
<input id="place" placeholder="นำไปใช้ที่ไหน">

<button onclick="saveData()">
บันทึก
</button>

<table id="stockTable">
<thead></thead>
<tbody></tbody>
</table>

<script>

const API =
"https://script.google.com/macros/s/AKfycbzY5rcaEq3kviu0iglxS61jAiCgNAuRrUcpwpzVuxkKYjLQkFXSL63YcO6-QUiWap0l/exec";

async function loadData(){

const response = await fetch(API);
const data = await response.json();

let head="<tr>";

data[0].forEach(col=>{
head += `<th>${col}</th>`;
});

head+="</tr>";

document.querySelector("thead").innerHTML=head;

let rows="";

for(let i=1;i<data.length;i++){

rows+="<tr>";

data[i].forEach(col=>{
rows += `<td>${col}</td>`;
});

rows+="</tr>";
}

document.querySelector("tbody").innerHTML=rows;

}

async function saveData(){

const bodyData = {

code:document.getElementById("code").value,
name:document.getElementById("name").value,
qty:document.getElementById("qty").value,
unit:document.getElementById("unit").value,
user:document.getElementById("user").value,
place:document.getElementById("place").value

};

await fetch(API,{
method:"POST",
body:JSON.stringify(bodyData)
});

alert("บันทึกสำเร็จ");

loadData();

}

loadData();

</script>

</body>
</html>
