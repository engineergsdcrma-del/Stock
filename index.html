<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>ระบบสต๊อกรายการ สป.กยย.สบร.รร.จปร.</title>

<style>
body{
  font-family:Arial,sans-serif;
  margin:20px;
}

input,select{
  padding:8px;
  margin:5px;
  min-width:150px;
}

button{
  padding:8px 15px;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  border:1px solid #ddd;
  padding:8px;
}

th{
  background:#2196f3;
  color:white;
}

#dashboard{
  display:flex;
  gap:20px;
  margin:20px 0;
}

.card{
  color:white;
  padding:20px;
  border-radius:10px;
  min-width:220px;
}

.blue{
  background:#2196f3;
}

.green{
  background:#4caf50;
}
</style>

</head>

<body>

<button onclick="location.href='remain.html'">
📦 ดูสต๊อกคงเหลือ
</button>

<h3>เพิ่มรายการเบิก</h3>

<select id="code">
<option value="">-- เลือกรหัสสินค้า --</option>
</select>

<input id="name" placeholder="ชื่อสินค้า" readonly>

<input id="unit" placeholder="หน่วย" readonly>

<input id="remain" placeholder="คงเหลือ" readonly>

<input id="qty" placeholder="จำนวน">

<input id="user" placeholder="ผู้เบิก">

<input id="place" placeholder="นำไปใช้ที่ไหน">

<button onclick="saveData()">บันทึก</button>

<br><br>

<input
type="text"
id="search"
placeholder="🔍 ค้นหารหัสสินค้า ชื่อสินค้า ผู้เบิก"
onkeyup="searchTable()"
style="width:320px;"

>

<div id="dashboard">

<div class="card blue">
<h3>📦 รายการทั้งหมด</h3>
<h2 id="totalRows">0</h2>
</div>

<div class="card green">
<h3>📊 จำนวนเบิกทั้งหมด</h3>
<h2 id="totalQty">0</h2>
</div>

</div>

<h3>📦 สต๊อกคงเหลือ</h3>

<table id="productTable">

<thead>
<tr>
<th>รหัส</th>
<th>ชื่อสินค้า</th>
<th>หน่วย</th>
<th>คงเหลือ</th>
</tr>
</thead>

<tbody id="productBody"></tbody>

</table>

<h3>📋 ประวัติการเบิก</h3>

<table id="stockTable">
<thead></thead>
<tbody></tbody>
</table>

<script>

const API =
"https://script.google.com/macros/s/AKfycbzY5rcaEq3kviu0iglxS61jAiCgNAuRrUcpwpzVuxkKYjLQkFXSL63YcO6-QUiWap0l/exec";


// โหลดสต๊อกคงเหลือ
async function loadRemain(){

const res =
await fetch(API + "?type=products");

const data =
await res.json();

let rows = "";

for(let i=1;i<data.length;i++){

rows += `
<tr>
<td>${data[i][0]}</td>
<td>${data[i][1]}</td>
<td>${data[i][2]}</td>
<td>${data[i][3]}</td>
</tr>
`;
}

document.getElementById("productBody").innerHTML =
rows;

}


// โหลดสินค้าเข้า dropdown
async function loadProducts(){

const res =
await fetch(API + "?type=products");

const data =
await res.json();

const select =
document.getElementById("code");

select.innerHTML =
'<option value="">-- เลือกรหัสสินค้า --</option>';

for(let i=1;i<data.length;i++){

select.innerHTML += `
<option
value="${data[i][0]}"
data-name="${data[i][1]}"
data-unit="${data[i][2]}"
data-remain="${data[i][3]}"
>
${data[i][0]}
</option>
`;
}

}


// เลือกรหัสสินค้า
document.addEventListener("change",function(e){

if(e.target.id==="code"){

const op =
e.target.options[e.target.selectedIndex];

document.getElementById("name").value =
op.dataset.name || "";

document.getElementById("unit").value =
op.dataset.unit || "";

document.getElementById("remain").value =
op.dataset.remain || "";

}

});


// โหลดประวัติ
async function loadData(){

const response =
await fetch(API);

const data =
await response.json();

let totalRows =
data.length - 1;

let totalQty = 0;

let head = "<tr>";

data[0].forEach(col=>{

head += `<th>${col}</th>`;

});

head += "</tr>";

document.querySelector("#stockTable thead").innerHTML =
head;

let rows = "";

for(let i=1;i<data.length;i++){

totalQty += Number(data[i][5]) || 0;

rows += "<tr>";

data[i].forEach(col=>{

rows += `<td>${col}</td>`;

});

rows += "</tr>";

}

document.querySelector("#stockTable tbody").innerHTML =
rows;

document.getElementById("totalRows").innerText =
totalRows;

document.getElementById("totalQty").innerText =
totalQty;

}


// บันทึก
async function saveData(){

if(
document.getElementById("code").value==="" ||
document.getElementById("qty").value===""
){
alert("กรุณากรอกข้อมูลให้ครบ");
return;
}

const remain =
Number(document.getElementById("remain").value);

const qty =
Number(document.getElementById("qty").value);

if(qty > remain){

alert("จำนวนเบิกมากกว่าคงเหลือ");

return;
}

const bodyData = {

code:
document.getElementById("code").value,

qty:
document.getElementById("qty").value,

user:
document.getElementById("user").value,

place:
document.getElementById("place").value

};

await fetch(API,{

method:"POST",

mode:"no-cors",

body:JSON.stringify(bodyData)

});

alert("บันทึกสำเร็จ");

document.getElementById("code").value="";
document.getElementById("name").value="";
document.getElementById("unit").value="";
document.getElementById("remain").value="";
document.getElementById("qty").value="";
document.getElementById("user").value="";
document.getElementById("place").value="";

setTimeout(()=>{

loadProducts();
loadRemain();
loadData();

},1000);

}


// ค้นหา
function searchTable(){

let keyword =
document.getElementById("search")
.value
.toLowerCase();

let rows =
document.querySelectorAll("#stockTable tbody tr");

rows.forEach(function(row){

let text =
row.innerText.toLowerCase();

row.style.display =
text.indexOf(keyword) > -1 ? "" : "none";

});

}


// เริ่มระบบ
loadProducts();
loadRemain();
loadData();

</script>

</body>
</html>
