<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ระบบคลังรายการ สป.กยย.สบร.รร.จปร.</title>

<style>

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#f4f6f9;
}

.header{
    background:#1976d2;
    color:white;
    padding:20px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
}

.header h1{
    margin:0;
    font-size:28px;
}

.logout-btn{
    background:#e53935;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.logout-btn:hover{
    background:#c62828;
}

.dashboard{
    max-width:1000px;
    margin:60px auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:30px;
    padding:0 20px;
}

.card{
    color:white;
    padding:40px;
    border-radius:20px;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.card:hover{
    transform:translateY(-8px);
}

.blue{
    background:linear-gradient(135deg,#2196f3,#1565c0);
}

.green{
    background:linear-gradient(135deg,#4caf50,#2e7d32);
}

.card h2{
    margin:0;
    font-size:30px;
}

.card p{
    margin-top:15px;
    font-size:16px;
    line-height:1.6;
}

.footer{
    text-align:center;
    color:#666;
    margin-top:50px;
    padding-bottom:30px;
}

</style>
</head>

<body>

<div class="header">

    <h1>📦 ระบบคลังรายการ สป.กยย.สบร.รร.จปร.</h1>

    <button class="logout-btn" onclick="logout()">
        🚪 Logout
    </button>

</div>

<div class="dashboard">

    <div class="card blue"
         onclick="location.href='remain.html'">

        <h2>📦 สต๊อกคงเหลือ</h2>

        <p>
            ตรวจสอบจำนวนสป.คงเหลือทั้งหมด
            พร้อมค้นหารายการสินค้า
        </p>

    </div>

    <div class="card green"
         onclick="location.href='issue.html'">

        <h2>📋 เบิกสินค้า</h2>

        <p>
            บันทึกรายการเบิกสินค้า
            และตรวจสอบประวัติการเบิก
        </p>

    </div>

</div>

<div class="footer">
    Stock Management System v1.0
</div>

<script>

const auth =
localStorage.getItem("auth");

if(auth !== "true"){

location.href="login.html";

}

function logout(){

localStorage.clear();

location.href="login.html";

}

</script>

</body>
</html>
```
