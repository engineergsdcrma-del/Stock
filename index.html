<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ระบบคลังรายการ สป.กยย.สบร.รร.จปร.</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:
linear-gradient(
135deg,
#1f3a1f,
#2e5a2e,
#4b6f44
);

min-height:100vh;
color:white;

}

.header{

background:#2e4d2c;

padding:20px 30px;

display:flex;
justify-content:space-between;
align-items:center;

border-bottom:3px solid #8bc34a;

box-shadow:
0 4px 15px rgba(0,0,0,.3);

}

.header h1{

font-size:32px;
font-weight:bold;

}

.logout-btn{

background:#d32f2f;
border:none;
padding:12px 20px;
color:white;
border-radius:10px;
cursor:pointer;
font-weight:bold;

transition:.3s;

}

.logout-btn:hover{

background:#f44336;
transform:scale(1.05);

}

.container{

max-width:1100px;
margin:auto;
padding:50px 20px;

}

.menu-grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(350px,1fr));

gap:35px;

}

.menu-card{

background:
rgba(255,255,255,.1);

backdrop-filter:
blur(10px);

padding:40px;

border-radius:25px;

text-align:center;

box-shadow:
0 8px 20px rgba(0,0,0,.3);

cursor:pointer;

transition:.4s;

}

.menu-card:hover{

transform:
translateY(-10px);

background:
rgba(255,255,255,.15);

}

.menu-card h2{

font-size:38px;
margin-bottom:15px;

}

.menu-card p{

font-size:18px;
line-height:1.7;

}

.footer{

margin-top:60px;

text-align:center;

color:#ddd;

font-size:14px;

}

@media(max-width:768px){

.header{

flex-direction:column;
gap:15px;

}

.header h1{

font-size:24px;
text-align:center;

}

.menu-grid{

grid-template-columns:1fr;

}

.menu-card{

padding:30px;

}

}

</style>

</head>

<body>

<div class="header">

<h1>
📦 ระบบคลังรายการ สป.กยย.สบร.รร.จปร.
</h1>

<button
class="logout-btn"
onclick="logout()">

🚪 Logout

</button>

</div>


<div class="container">
<div class="menu-grid">

<div
class="menu-card"
onclick="location.href='remain.html'">

<h2>📦 สต๊อกคงเหลือ</h2>

<p>

ตรวจสอบรายการ สป.
และจำนวนคงเหลือทั้งหมด

</p>

</div>


<div
class="menu-card"
onclick="location.href='issue.html'">
  
<h2>📋 เบิกสป.</h2>

<p>

บันทึกรายการเบิก
และดูประวัติการเบิก

</p>

</div>

</div>

</div>
</div>

<div class="footer">

</div>

<script>

/* ตรวจสอบสิทธิ์ */

const auth =
JSON.parse(
localStorage.getItem("auth")
);

if(
!auth ||
auth.login !== true
){

location.href=
"login.html";

}

/* logout */

function logout(){

localStorage.clear();

location.href="login.html";

}

</script>

</body>
</html>
