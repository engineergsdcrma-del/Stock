<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ระบบสต๊อกสินค้า</title>

<style>
body{
  font-family:Arial;
  margin:20px;
}

input,select{
  padding:8px;
  margin:5px;
}

button{
  padding:8px 15px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  border:1px solid #ddd;
  padding:8px;
}

th{
  background:#2196f3;
  color:white;
}
</style>

</head>
<body>

<h1>📦 ระบบสต๊อกสินค้า</h1>

<h3>เพิ่มรายการเบิก</h3>

<select id="code"></select>

<input id="name" placeholder="ชื่อสินค้า" readonly>

<input id="unit" placeholder="หน่วย" readonly>

<input id="qty" placeholder="จำนวน">

<input id="user" placeholder="ผู้เบิก">

<input id="place" placeholder="นำไปใช้ที่ไหน">

<button onclick="saveData()">
บันทึก
</button>

<table id="stockTable">
<thead></thead>
<tbody></tbody>
</table>

<script>

const API =
"https://script.google.com/macros/s/AKfycbzY5rcaEq3kviu0iglxS61jAiCgNAuRrUcpwpzVuxkKYjLQkFXSL63YcO6-QUiWap0l/exec";


// โหลดสินค้า
async function loadProducts(){

  const res =
  await fetch(API + "?type=products");

  const data =
  await res.json();

  const select =
  document.getElementById("code");

  select.innerHTML =
  '<option value="">-- เลือกรหัสสินค้า --</option>';

  for(let i=1;i<data.length;i++){

    select.innerHTML +=
    `<option
      value="${data[i][0]}"
      data-name="${data[i][1]}"
      data-unit="${data[i][2]}"
    >
      ${data[i][0]}
    </option>`;
  }
}


// เลือกรหัสแล้วเติมข้อมูล
document.addEventListener("change",function(e){

  if(e.target.id=="code"){

    const op =
    e.target.options[e.target.selectedIndex];

    document.getElementById("name").value =
    op.dataset.name || "";

    document.getElementById("unit").value =
    op.dataset.unit || "";
  }

});


// โหลดตาราง
async function loadData(){

  const response =
  await fetch(API);

  const data =
  await response.json();

  let head="<tr>";

  data[0].forEach(col=>{
    head += `<th>${col}</th>`;
  });

  head+="</tr>";

  document.querySelector("thead").innerHTML=head;

  let rows="";

  for(let i=1;i<data.length;i++){

    rows+="<tr>";

    data[i].forEach(col=>{
      rows += `<td>${col}</td>`;
    });

    rows+="</tr>";
  }

  document.querySelector("tbody").innerHTML=rows;
}


// บันทึก
async function saveData(){

  const bodyData = {

    code:
    document.getElementById("code").value,

    qty:
    document.getElementById("qty").value,

    user:
    document.getElementById("user").value,

    place:
    document.getElementById("place").value
  };

  await fetch(API,{

    method:"POST",

    mode:"no-cors",

    body:JSON.stringify(bodyData)

  });

  alert("บันทึกสำเร็จ");

  setTimeout(()=>{

    loadData();

  },1000);
}


loadProducts();
loadData();

</script>

</body>
</html>
