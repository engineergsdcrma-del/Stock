<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title> ระบบสต๊อกรายการ สป.กยย.สบร.รร.จปร. </title>

<style>
body{
  font-family:Arial;
  margin:20px;
}

input,select{
  padding:8px;
  margin:5px;
  min-width:150px;
}

button{
  padding:8px 15px;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  border:1px solid #ddd;
  padding:8px;
}

th{
  background:#2196f3;
  color:white;
}

h1{
  margin-bottom:10px;
}
</style>

</head>

<body>

<h1>📦 ระบบสต๊อกรายการ สป.กยย.สบร.รร.จปร. </h1>

<h3>เพิ่มรายการเบิก</h3>

<select id="code">
  <option value="">-- เลือกรหัสสินค้า --</option>
</select>

<input id="name" placeholder="ชื่อสินค้า" readonly>
<input id="unit" placeholder="หน่วย" readonly>
<input id="qty" placeholder="จำนวน">
<input id="user" placeholder="ผู้เบิก">
<input id="place" placeholder="นำไปใช้ที่ไหน">

<button onclick="saveData()">บันทึก</button>

<input
  type="text"
  id="search"
  placeholder="🔍 ค้นหารหัสสินค้า, ชื่อสินค้า, ผู้เบิก"
  onkeyup="searchTable()"
  style="width:300px;padding:8px;margin-top:15px;">

<div id="dashboard" style="
display:flex;
gap:20px;
margin:20px 0;
">

  <div style="
  background:#2196f3;
  color:white;
  padding:20px;
  border-radius:10px;
  min-width:200px;">
    <h3>📦 รายการทั้งหมด</h3>
    <h2 id="totalRows">0</h2>
  </div>

  <div style="
  background:#4caf50;
  color:white;
  padding:20px;
  border-radius:10px;
  min-width:200px;">
    <h3>📊 จำนวนเบิกทั้งหมด</h3>
    <h2 id="totalQty">0</h2>
  </div>

</div>
  
<table id="stockTable">
  <thead></thead>
  <tbody></tbody>
</table>

<script>

// ใส่ URL Apps Script ของคุณ
const API =
"https://script.google.com/macros/s/AKfycbzY5rcaEq3kviu0iglxS61jAiCgNAuRrUcpwpzVuxkKYjLQkFXSL63YcO6-QUiWap0l/exec";


// ========================
// โหลดสินค้า
// ========================

async function loadProducts(){

  const res =
  await fetch(API + "?type=products");

  const data =
  await res.json();

  const select =
  document.getElementById("code");

  select.innerHTML =
  '<option value="">-- เลือกรหัสสินค้า --</option>';

  for(let i=1;i<data.length;i++){

    select.innerHTML += `
      <option
        value="${data[i][0]}"
        data-name="${data[i][1]}"
        data-unit="${data[i][2]}"
      >
        ${data[i][0]}
      </option>
    `;
  }
}


// ========================
// เลือกรหัสสินค้า
// ========================

document.addEventListener("change",function(e){

  if(e.target.id==="code"){

    const op =
    e.target.options[e.target.selectedIndex];

    document.getElementById("name").value =
    op.dataset.name || "";

    document.getElementById("unit").value =
    op.dataset.unit || "";
  }

});


// ========================
// โหลดข้อมูลตาราง
// ========================

async function loadData(){

  const response =
  await fetch(API);

  const data =
  await response.json();

  let totalRows = data.length - 1;
  let totalQty = 0;

  let head = "<tr>";

  data[0].forEach(col=>{

    head += `<th>${col}</th>`;

  });

  head += "</tr>";

  document.querySelector("thead").innerHTML =
  head;

  let rows = "";

  for(let i=1;i<data.length;i++){

    totalQty += Number(data[i][5]) || 0;

    console.log(data[i][5]);
    console.log(totalQty);

    rows += "<tr>";

    data[i].forEach(col=>{

      rows += `<td>${col}</td>`;

    });

    rows += "</tr>";
  }

  document.querySelector("tbody").innerHTML =
  rows;

  document.getElementById("totalRows").innerText =
totalRows;

document.getElementById("totalQty").innerText =
totalQty;
}


// ========================
// บันทึกข้อมูล
// ========================

async function saveData(){

  if(
    document.getElementById("code").value === "" ||
    document.getElementById("qty").value === ""
  ){
    alert("กรุณากรอกข้อมูลให้ครบ");
    return;
  }

  const bodyData = {

    code:
    document.getElementById("code").value,

    name:
    document.getElementById("name").value,

    unit:
    document.getElementById("unit").value,

    qty:
    document.getElementById("qty").value,

    user:
    document.getElementById("user").value,

    place:
    document.getElementById("place").value

  };

  await fetch(API,{

    method:"POST",

    mode:"no-cors",

    body:JSON.stringify(bodyData)

  });

  alert("บันทึกสำเร็จ");

  // ล้างฟอร์ม

  document.getElementById("code").value="";
  document.getElementById("name").value="";
  document.getElementById("unit").value="";
  document.getElementById("qty").value="";
  document.getElementById("user").value="";
  document.getElementById("place").value="";

  setTimeout(()=>{

    loadData();

  },1000);
}


// ========================
// เริ่มต้นระบบ
// ========================

function searchTable(){

  let keyword =
  document.getElementById("search")
  .value
  .toLowerCase();

  let rows =
  document.querySelectorAll("#stockTable tbody tr");

  rows.forEach(row=>{

    let text =
    row.innerText.toLowerCase();

    if(text.includes(keyword)){
      row.style.display = "";
    }else{
      row.style.display = "none";
    }

  });

}
 function searchTable(){

  let keyword =
  document.getElementById("search")
  .value
  .toLowerCase();

  let rows =
  document.querySelectorAll("#stockTable tbody tr");

  rows.forEach(function(row){

    let text =
    row.innerText.toLowerCase();

    if(text.indexOf(keyword) > -1){
      row.style.display = "";
    }else{
      row.style.display = "none";
    }

  });

} 
loadProducts();
loadData();

</script>

</body>
</html>
