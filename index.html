<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>ระบบคลังรายการ สป.กยย.สบร.รร.จปร.</title>

<style>
body{
  font-family:Arial,sans-serif;
  margin:20px;
}

input,select{
  padding:8px;
  margin:5px;
  min-width:150px;
}

button{
  padding:8px 15px;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  border:1px solid #ddd;
  padding:8px;
}

th{
  background:#2196f3;
  color:white;
}

#dashboard{
  display:flex;
  gap:20px;
  margin:20px 0;
}

.card{
  color:white;
  padding:20px;
  border-radius:10px;
  min-width:220px;
}

.blue{
  background:#2196f3;
}

.green{
  background:#4caf50;
}
</style>

</head>

<body>



  
<h1>📦ระบบคลังรายการ สป.กยย.สบร.รร.จปร</h1>
<button onclick="logout()">
🚪 Logout
</button>

<br><br>

<input
type="text"
id="search"
placeholder="🔍 ค้นหารหัสสินค้า ชื่อสินค้า ผู้เบิก"
onkeyup="searchTable()"
style="width:320px;"

>

<div id="dashboard">

<div class="card blue"
     onclick="window.location.href='remain.html'"
     style="cursor:pointer;">

<h3>📦 รายการสป.คงเหลือ</h3>


</div>

<div class="card green"
     onclick="location.href='issue.html'"
     style="cursor:pointer;">

<h3>📊 รายการเบิก สป. </h3>


</div>


 
<table id="stockTable">
<thead></thead>
<tbody></tbody>
</table>

<script>

  function logout(){

  localStorage.removeItem("login");

  location.href="login.html";

}

  if(localStorage.getItem("login")!="ok"){

  location.href="login.html";

}


  
const API =
"https://script.google.com/macros/s/AKfycbzY5rcaEq3kviu0iglxS61jAiCgNAuRrUcpwpzVuxkKYjLQkFXSL63YcO6-QUiWap0l/exec";


// โหลดสต๊อกคงเหลือ



// โหลดประวัติ
async function loadData(){

const response =
await fetch(API);

const data =
await response.json();

let totalRows =
data.length - 1;

let totalQty = 0;

let head = "<tr>";

data[0].forEach(col=>{

head += `<th>${col}</th>`;

});

head += "</tr>";

document.querySelector("#stockTable thead").innerHTML =
head;

let rows = "";

for(let i=1;i<data.length;i++){

totalQty += Number(data[i][5]) || 0;

rows += "<tr>";

data[i].forEach(col=>{

rows += `<td>${col}</td>`;

});

rows += "</tr>";

}

document.querySelector("#stockTable tbody").innerHTML =
rows;


}






// ค้นหา
function searchTable(){

let keyword =
document.getElementById("search")
.value
.toLowerCase();

let rows =
document.querySelectorAll("#stockTable tbody tr");

rows.forEach(function(row){

let text =
row.innerText.toLowerCase();

row.style.display =
text.indexOf(keyword) > -1 ? "" : "none";

});

}


// เริ่มระบบ


loadData();

</script>

</body>
</html>
