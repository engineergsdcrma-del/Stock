<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>จำนวนเบิกทั้งหมด</title>

<style>

  .table-header{

display:flex;
justify-content:space-between;
align-items:center;
margin:15px 0;
flex-wrap:wrap;

}

.table-header select{

padding:8px;
border-radius:8px;
margin-right:10px;

}
  
body{
font-family:Arial,sans-serif;
margin:0;
padding:30px;
background:#f4f6f9;
}

.container{

max-width:1100px;
margin:auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 3px 15px rgba(0,0,0,.15);

}

.header-bar{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;

}

button{

padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;

}

.back{

background:#666;
color:white;

}

.save{

background:#1976d2;
color:white;

}

input,select{

padding:10px;
border:1px solid #ccc;
border-radius:8px;
margin:5px;
width:180px;

}

.form-row{

display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:25px;

}

.search-box{

margin:20px 0;

}

.search-box input{

width:350px;

}

table{

width:100%;
border-collapse:collapse;
margin-top:20px;

}

th{

background:#1e88e5;
color:white;
padding:12px;

}

td{

padding:10px;
border-bottom:1px solid #ddd;

}

tr:hover{

background:#f5f5f5;

}



/* hover */
tbody tr:hover{

background:#d8ebff;

transition:.2s;

}

</style>

</head>

<body>

  <div class="header-bar">

<h1>📋 เบิกสป. </h1>

<button
class="back"
onclick="location.href='index.html'">

⬅ กลับหน้าหลัก

</button>

</div>

<hr>

<div class="form-row">

<select id="code">
<option>-- เลือกรหัสสป. --</option>
</select>

<input
id="name"
placeholder="ชื่อสป.">

<input
id="unit"
placeholder="หน่วย">

<input
id="remain"
placeholder="คงเหลือ">

<input
id="qty"
placeholder="จำนวน">

<input
id="user"
placeholder="ผู้เบิก">

<input
id="place"
placeholder="นำไปใช้ที่ไหน">

<button
onclick="addItem()">

➕ เพิ่มรายการ

</button>

<button
onclick="addItem()">

➕ เพิ่มรายการ

</button>

<div id="selectedItems"
style="
width:100%;
margin-top:15px;
padding:10px;
background:#f5f5f5;
border-radius:10px;
">

<b>รายการที่เลือก</b>

<div id="itemList">

ยังไม่มีรายการ

</div>

</div>

<br>

<input
id="user"
placeholder="ผู้เบิก">

<input
id="place"
placeholder="นำไปใช้ที่ไหน">

<button
id="saveBtn"
class="save"
onclick="saveData()">

💾 บันทึก

</button>

</div>
  

<h3>📋 ประวัติการเบิก</h3>

<div class="table-header">

<div>

<label>📅 เดือน:</label>

<select id="monthFilter">
<option value="">ทั้งหมด</option>
<option value="01">มกราคม</option>
<option value="02">กุมภาพันธ์</option>
<option value="03">มีนาคม</option>
<option value="04">เมษายน</option>
<option value="05">พฤษภาคม</option>
<option value="06">มิถุนายน</option>
<option value="07">กรกฎาคม</option>
<option value="08">สิงหาคม</option>
<option value="09">กันยายน</option>
<option value="10">ตุลาคม</option>
<option value="11">พฤศจิกายน</option>
<option value="12">ธันวาคม</option>
</select>

<label>📆 ปี:</label>

<select id="yearFilter">
<option value="">ทั้งหมด</option>
<option value="2569">2569</option>
<option value="2570">2570</option>
<option value="2571">2571</option>
</select>

</div>


  <input
type="text"
id="search"
placeholder="🔍 ค้นหารหัสสป. ชื่อสป. ผู้เบิก"
onkeyup="searchTable()"
style="
width:350px;
padding:8px;
margin:10px 0;
">

</div>

<table id="stockTable">

<thead></thead>

<tbody></tbody>

</table>


<script>

const API =
"https://script.google.com/macros/s/AKfycbzY5rcaEq3kviu0iglxS61jAiCgNAuRrUcpwpzVuxkKYjLQkFXSL63YcO6-QUiWap0l/exec";
let issueItems=[];

// โหลดสินค้า
async function loadProducts(){

  const res =
  await fetch(API + "?type=products");

  const data =
  await res.json();

  const select =
  document.getElementById("code");

  select.innerHTML =
  '<option value="">-- เลือกรหัสสป. --</option>';

  for(let i=1;i<data.length;i++){

    select.innerHTML += `
      <option
        value="${data[i][0]}"
        data-name="${data[i][1]}"
        data-unit="${data[i][2]}"
        data-remain="${data[i][3]}"
      >
        ${data[i][0]} - ${data[i][1]}
      </option>
    `;
  }
}


// เลือกสินค้า
document
.getElementById("code")
.addEventListener("change",function(){

  const op =
  this.options[this.selectedIndex];

  document.getElementById("name").value =
  op.dataset.name || "";

  document.getElementById("unit").value =
  op.dataset.unit || "";

  document.getElementById("remain").value =
  op.dataset.remain || "";

});

function addItem(){

const code=
document.getElementById("code").value;

const qty=
document.getElementById("qty").value;

if(!code || !qty){

alert(
"กรุณาเลือกสินค้าและจำนวน"
);

return;

}

alert(
"เพิ่มรายการแล้ว"
);

}

function addItem(){

const code=
document.getElementById("code").value;

const name=
document.getElementById("name").value;

const qty=
document.getElementById("qty").value;

if(!code || !qty){

alert(
"กรุณาเลือกสินค้าและจำนวน"
);

return;

}

issueItems.push({

code:code,
name:name,
qty:qty

});

showItems();

document.getElementById(
"qty"
).value="";

}


function showItems(){

let html="";

if(issueItems.length===0){

html="ยังไม่มีรายการ";

}else{

issueItems.forEach((item,index)=>{

html+=`

<div style="
padding:8px;
margin:5px;
background:white;
border-radius:8px;
">

- ${item.name}

จำนวน ${item.qty}

<button
onclick="removeItem(${index})"
style="
float:right;
background:red;
color:white;
">

ลบ

</button>

</div>

`;

});

}

document.getElementById(
"itemList"
).innerHTML=
html;

}


function removeItem(index){

issueItems.splice(
index,
1
);

showItems();

}

  
async function loadData(){

const response =
await fetch(API);

const data =
await response.json();

let head = "<tr>";

data[0].forEach(col=>{

head += `<th>${col}</th>`;

});

head += "</tr>";

document.querySelector(
"#stockTable thead"
).innerHTML = head;

let rows = "";

for(let i=1;i<data.length;i++){

rows += "<tr>";

data[i].forEach(col=>{

rows += `<td>${col}</td>`;

});

rows += "</tr>";

}

document.querySelector(
"#stockTable tbody"
).innerHTML = rows;

// เปลี่ยนสีตามวันที่
const tableRows =
document.querySelectorAll(
"#stockTable tbody tr"
);

let lastDate="";
let colorIndex=0;

tableRows.forEach(function(row){

const currentDate =
row.cells[1]
.textContent.trim();

if(currentDate!==lastDate){

colorIndex++;
lastDate=currentDate;

}

if(colorIndex%2===0){

row.style.background =
"#f1f7ff";

}else{

row.style.background =
"#ffffff";

}

});

// กรองเดือน/ปีหลังโหลดเสร็จ
filterDate();

}

  


// บันทึก
let isSaving=false;

async function saveData(){

if(isSaving) return;

const remain=
Number(
document.getElementById("remain").value
);

const qty=
Number(
document.getElementById("qty").value
);

if(qty>remain){

alert(
"จำนวนเบิกมากกว่าคงเหลือ"
);

return;

}

const code=
document.getElementById("code").value;

const user=
document.getElementById("user").value;

const place=
document.getElementById("place").value;

if(
!code||
!qty||
!user||
!place
){

alert(
"กรอกข้อมูลให้ครบ"
);

return;

}

isSaving=true;

const btn=
document.getElementById(
"saveBtn"
);

btn.disabled=true;

btn.innerHTML=
"กำลังบันทึก...";

try{

const bodyData={

code:code,
qty:qty,
user:user,
place:place

};

await fetch(API,{

method:"POST",
mode:"no-cors",
body:JSON.stringify(bodyData)

});

alert(
"✅ บันทึกสำเร็จ"
);

setTimeout(()=>{

location.reload();

},1000);

}catch(error){

alert(
"❌ เกิดข้อผิดพลาด"
);

console.log(error);

btn.disabled=false;

btn.innerHTML=
"บันทึก";

isSaving=false;

}

}

function searchTable(){

  let keyword =
  document.getElementById("search")
  .value
  .toLowerCase();

  let rows =
  document.querySelectorAll("#stockTable tbody tr");

  rows.forEach(function(row){

    let text =
    row.innerText.toLowerCase();

    if(text.indexOf(keyword) > -1){
      row.style.display = "";
    }else{
      row.style.display = "none";
    }

  });

}

const now = new Date();

const currentMonth =
String(now.getMonth()+1)
.padStart(2,"0");

const currentYear =
String(now.getFullYear()+543);

// ตั้งค่าอัตโนมัติ
document.getElementById(
"monthFilter"
).value=currentMonth;

document.getElementById(
"yearFilter"
).value=currentYear;



function filterDate(){

const month =
document.getElementById(
"monthFilter"
).value;

const year =
document.getElementById(
"yearFilter"
).value;

const rows =
document.querySelectorAll(
"#stockTable tbody tr"
);

rows.forEach(function(row){

if(!row.cells[1]) return;

const date =
row.cells[1]
.textContent.trim();

if(date==="") return;

// ตัวอย่าง 10/06/2569
const parts =
date.split("/");

if(parts.length<3)return;

const rowMonth =
parts[1];

const rowYear =
parts[2];

if(

(month==="" || rowMonth===month)

&&

(year==="" || rowYear===year)

){

row.style.display="";

}else{

row.style.display="none";

}

});

}


// เปลี่ยนเดือน
document
.getElementById("monthFilter")
.addEventListener(
"change",
filterDate
);


// เปลี่ยนปี
document
.getElementById("yearFilter")
.addEventListener(
"change",
filterDate
);


// โหลดครั้งแรก
window.onload=function(){

loadProducts();

loadData();

};

  
  


</script>

</body>
</html>
