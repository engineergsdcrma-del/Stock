<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Dashboard สต๊อก</title>

<style>

body{
font-family:Arial,sans-serif;
margin:20px;
background:#f5f5f5;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.back-btn{
background:#e5e7eb;
border:none;
padding:10px 20px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

.card{
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.card h2{
margin-top:0;
}

.item{
padding:8px;
margin-bottom:8px;
background:#f8f9fa;
border-radius:8px;
}

.item-name{
font-weight:bold;
}

.item-stock{
color:#555;
margin-top:4px;
}

</style>

</head>

<body>

<div class="header">
<h1>📊 Dashboard สต๊อก</h1>

<button class="back-btn"
onclick="location.href='remain.html'">
⬅ กลับ </button>

</div>

<div class="dashboard">

<div class="card">
<h2>🏢 บก.</h2>
<div id="groupA"></div>
</div>

<div class="card">
<h2>🏠 อาคาร</h2>
<div id="groupB"></div>
</div>

<div class="card">
<h2>⚡ ไฟฟ้า</h2>
<div id="groupC"></div>
</div>

<div class="card">
<h2>🚰 ประปา</h2>
<div id="groupD"></div>
</div>

<div class="card">
<h2>💧 น้ำเสีย</h2>
<div id="groupE"></div>
</div>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbzY5rcaEq3kviu0iglxS61jAiCgNAuRrUcpwpzVuxkKYjLQkFXSL63YcO6-QUiWap0l/exec";

async function loadDashboard(){

const res =
await fetch(API + "?type=products");

const data =
await res.json();

let htmlA="";
let htmlB="";
let htmlC="";
let htmlD="";
let htmlE="";

for(let i=1;i<data.length;i++){

const code = data[i][0];
const name = data[i][1];
const unit = data[i][2];
const remain = data[i][3];

const item = `
<div class="item">
<div class="item-name">${name}</div>
<div class="item-stock">
คงเหลือ ${remain} ${unit}
</div>
</div>
`;

if(code.startsWith("A")) htmlA += item;
if(code.startsWith("B")) htmlB += item;
if(code.startsWith("C")) htmlC += item;
if(code.startsWith("D")) htmlD += item;
if(code.startsWith("E")) htmlE += item;

}

document.getElementById("groupA").innerHTML = htmlA;
document.getElementById("groupB").innerHTML = htmlB;
document.getElementById("groupC").innerHTML = htmlC;
document.getElementById("groupD").innerHTML = htmlD;
document.getElementById("groupE").innerHTML = htmlE;

}

loadDashboard();

</script>

</body>
</html>
