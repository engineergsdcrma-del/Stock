<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>สต๊อกคงเหลือ</title>

<style>

body{
  font-family:Arial;
  margin:20px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border:1px solid #ddd;
  padding:8px;
}

th{
  background:#2196f3;
  color:white;
}

button{
padding:10px 18px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
color:black;
margin:3px;
transition:0.3s;
}

button:hover{
transform:translateY(-2px);
opacity:0.9;
}

}

.group-btn{
  background:#556b2f;
  color:black;
  border:none;
  border-radius:8px;
  padding:10px 18px;
  font-weight:bold;
  margin:4px;
  cursor:pointer;
  transition:0.3s;
}

.group-btn:hover{
  background:#6b8e23;
  transform:translateY(-2px);
}

.group-btn:active{
  transform:translateY(0px);
}
  
</style>
</head>

<body>

<h1>📦 สต๊อกคงเหลือ</h1>

<div style="margin-bottom:20px;">

<button onclick="location.href='index.html'">
⬅ กลับหน้าหลัก
</button>

<button onclick="location.href='addstock.html'">
➕ เพิ่มสต๊อกสินค้า
</button>


  <br><br>

<button class="group-btn" onclick="filterGroup('A')">
🏢 บก.
</button>

<button class="group-btn" onclick="filterGroup('B')">
🏠 อาคาร
</button>

<button class="group-btn" onclick="filterGroup('C')">
⚡ ไฟฟ้า
</button>

<button class="group-btn" onclick="filterGroup('D')">
🚰 ประปา
</button>

<button class="group-btn" onclick="filterGroup('E')">
💧 น้ำเสีย
</button>

<button class="group-btn" onclick="filterGroup('ALL')">
📋 ทั้งหมด
</button>

  
  
</div>

  
<input
type="text"
id="search"
placeholder="🔍 ค้นหารหัสสินค้า หรือ ชื่อสินค้า"
style="
width:300px;
padding:8px;
margin:10px 0;
">

  
<table id="productTable">

<thead>
<tr>
<th>รหัส</th>
<th>ชื่อสินค้า</th>
<th>หน่วย</th>
<th>คงเหลือ</th>
</tr>
</thead>

<tbody id="productBody"></tbody>

</table>

<script>

const API =
"https://script.google.com/macros/s/AKfycbzY5rcaEq3kviu0iglxS61jAiCgNAuRrUcpwpzVuxkKYjLQkFXSL63YcO6-QUiWap0l/exec";

async function loadRemain(){

 const res =
 await fetch(API + "?type=products");

 const data =
 await res.json();

 let rows = "";

 for(let i=1;i<data.length;i++){

   rows += `
   <tr>
     <td>${data[i][0]}</td>
     <td>${data[i][1]}</td>
     <td>${data[i][2]}</td>
     <td>${data[i][3]}</td>
   </tr>
   `;
 }

 document.getElementById("productBody").innerHTML =
 rows;
}

loadRemain();

document
.getElementById("search")
.addEventListener("keyup", searchTable);

  function searchTable(){

  const keyword =
  document.getElementById("search")
  .value
  .trim()
  .toLowerCase();

  const rows =
  document.querySelectorAll("#productBody tr");

  rows.forEach(function(row){

    const code =
    row.cells[0].textContent.toLowerCase();

    const name =
    row.cells[1].textContent.toLowerCase();

    if(
      code.includes(keyword) ||
      name.includes(keyword)
    ){
      row.style.display = "";
    }else{
      row.style.display = "none";
    }

  });

}


  function filterGroup(group){

  const rows =
  document.querySelectorAll("#productBody tr");

  rows.forEach(function(row){

    const code =
    row.cells[0].textContent;

    if(group === "ALL"){

      row.style.display = "";

    }else{

      if(code.startsWith(group)){
        row.style.display = "";
      }else{
        row.style.display = "none";
      }

    }

  });

}


  
</script>

</body>
</html>
