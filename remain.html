<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>สต๊อกคงเหลือ</title>

<style>

<style>

body{
font-family:Arial,sans-serif;
margin:0;
padding:30px;
background:#f4f6f9;
}

.container{

max-width:1100px;
margin:auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 3px 15px rgba(0,0,0,.15);

}

h1{

margin-bottom:25px;

}

.top-btn{

margin-bottom:20px;

}

button{

padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;

}

.back{

background:#555;
color:white;

}

.add{

background:#7e57c2;
color:white;

}

.filter{

margin:20px 0;

}

.filter button{

background:#eee;
margin-right:10px;
margin-bottom:10px;

}

input{

padding:10px;
width:300px;
border:1px solid #ccc;
border-radius:8px;
margin-top:15px;

}

table{

width:100%;
margin-top:20px;
border-collapse:collapse;
overflow:hidden;
border-radius:10px;

}

th{

background:#1e88e5;
color:white;
padding:14px;

}

td{

padding:12px;
border-bottom:1px solid #ddd;

}

tr:hover{

background:#f5f5f5;

}

.dashboard{

float:right;
background:#eee;

}


</style>
</head>

<body>
  <div class="container">

<div class="header-bar">

<h1>📦 สต๊อกคงเหลือ</h1>

<button
class="dashboard-btn"
onclick="location.href='dashboard.html'">
📊 Dashboard
</button>

</div>
  

<div style="margin-bottom:20px;">

<button onclick="location.href='index.html'">
⬅ กลับหน้าหลัก
</button>

<button onclick="location.href='addstock.html'">
➕ เพิ่มสต๊อกสินค้า
</button>


  <br><br>

<button class="group-btn" onclick="filterGroup('A')">
🏢 บก.
</button>

<button class="group-btn" onclick="filterGroup('B')">
🏠 อาคาร
</button>

<button class="group-btn" onclick="filterGroup('C')">
⚡ ไฟฟ้า
</button>

<button class="group-btn" onclick="filterGroup('D')">
🚰 ประปา
</button>

<button class="group-btn" onclick="filterGroup('E')">
💧 น้ำเสีย
</button>

<button class="group-btn" onclick="filterGroup('ALL')">
📋 ทั้งหมด
</button>

  
  
</div>

  
<input
type="text"
id="search"
placeholder="🔍 ค้นหารหัสสินค้า หรือ ชื่อสินค้า"
style="
width:300px;
padding:8px;
margin:10px 0;
">

  
<table id="productTable">

<thead>
<tr>
<th>รหัส</th>
<th>ชื่อสินค้า</th>
<th>หน่วย</th>
<th>คงเหลือ</th>
</tr>
</thead>

<tbody id="productBody"></tbody>

</table>

<script>

const API =
"https://script.google.com/macros/s/AKfycbzY5rcaEq3kviu0iglxS61jAiCgNAuRrUcpwpzVuxkKYjLQkFXSL63YcO6-QUiWap0l/exec";

async function loadRemain(){

 const res =
 await fetch(API + "?type=products");

 const data =
 await res.json();

 let rows = "";

 for(let i=1;i<data.length;i++){

   rows += `
   <tr>
     <td>${data[i][0]}</td>
     <td>${data[i][1]}</td>
     <td>${data[i][2]}</td>
     <td>${data[i][3]}</td>
   </tr>
   `;
 }

 document.getElementById("productBody").innerHTML =
 rows;
}

loadRemain();

document
.getElementById("search")
.addEventListener("keyup", searchTable);

  function searchTable(){

  const keyword =
  document.getElementById("search")
  .value
  .trim()
  .toLowerCase();

  const rows =
  document.querySelectorAll("#productBody tr");

  rows.forEach(function(row){

    const code =
    row.cells[0].textContent.toLowerCase();

    const name =
    row.cells[1].textContent.toLowerCase();

    if(
      code.includes(keyword) ||
      name.includes(keyword)
    ){
      row.style.display = "";
    }else{
      row.style.display = "none";
    }

  });

}


  function filterGroup(group){

  const rows =
  document.querySelectorAll("#productBody tr");

  rows.forEach(function(row){

    const code =
    row.cells[0].textContent;

    if(group === "ALL"){

      row.style.display = "";

    }else{

      if(code.startsWith(group)){
        row.style.display = "";
      }else{
        row.style.display = "none";
      }

    }

  });

}


  
</script>
</div>
</body>
</html>
