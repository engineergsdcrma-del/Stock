  <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>เพิ่มสต๊อกสินค้า</title>

<style>
body{
  font-family:Arial;
  margin:20px;
}

input,select{
  padding:8px;
  margin:5px;
}

button{
  padding:10px 20px;
}
</style>

</head>

<body>

 <script>

// ตรวจสอบการเข้าสู่ระบบ
const auth =
localStorage.getItem("auth");

if(auth !== "true"){

alert(
"⛔ รหัสไม่ถูกต้อง\n\nคุณไม่ใช่เจ้าหน้าที่"
);

location.href="login.html";

}

</script>

 
<h1>➕ เพิ่มสต๊อกสินค้า</h1>

<button onclick="location.href='remain.html'">
⬅ กลับหน้าสต๊อก
</button>

<br><br>

<select id="code">
<option value="">-- เลือกรหัสสินค้า --</option>
</select>

<input id="qty" placeholder="จำนวนที่เพิ่ม">

<button onclick="saveStock()">
บันทึก
</button>


  <script>

const API =
"https://script.google.com/macros/s/AKfycbzY5rcaEq3kviu0iglxS61jAiCgNAuRrUcpwpzVuxkKYjLQkFXSL63YcO6-QUiWap0l/exec";

async function loadProducts(){

  const res =
  await fetch(API + "?type=products");

  const data =
  await res.json();

  const select =
  document.getElementById("code");

  select.innerHTML =
  '<option value="">-- เลือกรหัสสินค้า --</option>';

  for(let i=1;i<data.length;i++){

    select.innerHTML += `
      <option value="${data[i][0]}">
      ${data[i][0]} - ${data[i][1]}
      </option>
    `;

  }

}

loadProducts();

    async function saveStock(){

  const code =
  document.getElementById("code").value;

  const qty =
  document.getElementById("qty").value;

  if(!code || !qty){

    alert("กรุณากรอกข้อมูล");

    return;
  }

  alert(
    "รหัสสินค้า : " + code +
    "\nจำนวนเพิ่ม : " + qty
  );

}

</script>
  
</body>
</html>
