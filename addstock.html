<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>เพิ่มสต๊อกสินค้า</title>

<style>

body{
font-family:Arial;
margin:20px;
background:#f4f6f9;
}

.container{
max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

input,select{

padding:10px;
margin:5px;
width:250px;
border:1px solid #ccc;
border-radius:8px;

}

button{

padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;

}

.save{
background:#1976d2;
color:white;
}

.back{
background:#666;
color:white;
}

table{

width:100%;
margin-top:30px;
border-collapse:collapse;

}

th{

background:#1976d2;
color:white;
padding:10px;

}

td{

padding:10px;
border-bottom:1px solid #ddd;

}

</style>

</head>

<body>

<script>

/* ตรวจสอบ login */

<script>

/* ตรวจสอบสิทธิ์ */

const auth =
JSON.parse(
localStorage.getItem("auth")
);

if(
!auth ||
auth.login !== true
){

alert(
"⛔ รหัสไม่ถูกต้อง\n\nคุณไม่ใช่เจ้าหน้าที่"
);

location.href="login.html";

}

</script>

</script>

<div class="container">

<h1>➕ เพิ่มสต๊อกสินค้า</h1>

<button
class="back"
onclick="location.href='remain.html'">

⬅ กลับหน้าสต๊อก

</button>

<br><br>

<select id="code">

<option value="">
-- เลือกรหัสสินค้า --
</option>

</select>

<input
id="qty"
type="number"
placeholder="จำนวนเพิ่ม">

<button
class="save"
onclick="saveStock()">

บันทึก

</button>


<h2>
📜 ประวัติการเพิ่มสต๊อก
</h2>

<table>

<thead>

<tr>

<th>วันที่</th>
<th>เวลา</th>
<th>รหัส</th>
<th>จำนวน</th>
<th>ผู้เพิ่ม</th>

</tr>

</thead>

<tbody id="history">

</tbody>

</table>

</div>

<script>

const API=
"https://script.google.com/macros/s/AKfycbzY5rcaEq3kviu0iglxS61jAiCgNAuRrUcpwpzVuxkKYjLQkFXSL63YcO6-QUiWap0l/exec";


async function loadProducts(){

const res=
await fetch(
API+"?type=products"
);

const data=
await res.json();

const select=
document.getElementById("code");

for(let i=1;i<data.length;i++){

select.innerHTML+=`

<option value="${data[i][0]}">

${data[i][0]} -
${data[i][1]}

</option>

`;

}

}



async function saveStock(){

const code=
document.getElementById("code").value;

const qty=
document.getElementById("qty").value;

if(!code||!qty){

alert("กรุณากรอกข้อมูล");

return;

}

const auth=
JSON.parse(
localStorage.getItem("auth")
);

await fetch(API,{

method:"POST",

body:JSON.stringify({

action:"addstock",
code:code,
qty:qty,
user:auth.user

})

});

alert("✅ เพิ่มสต๊อกสำเร็จ");

location.reload();

}



async function loadHistory(){

const res=
await fetch(
API+"?type=addhistory"
);

const data=
await res.json();

const table=
document.getElementById("history");

table.innerHTML="";

for(let i=1;i<data.length;i++){

table.innerHTML+=`

<tr>

<td>${data[i][0]}</td>
<td>${data[i][1]}</td>
<td>${data[i][2]}</td>
<td>${data[i][4]}</td>
<td>${data[i][5]}</td>

</tr>

`;

}

}

loadProducts();
loadHistory();

</script>

</body>
</html>
