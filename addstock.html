<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>เพิ่มสต๊อกสินค้า</title>

<style>

body{
font-family:Arial;
margin:20px;
background:#f4f6f9;
}

.container{
max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

input,select{

padding:10px;
margin:5px;
width:250px;
border:1px solid #ccc;

}

button{

}

.save{

color:white;
}

.back{
background:#666;
color:white;
}

table{

width:100%;
margin-top:30px;
border-collapse:collapse;

}

th{

background:#1976d2;
color:white;

}

td{

padding:10px;
border-bottom:1px solid #ddd;

}

</style>

</head>

<body>


<script>

/* ตรวจสอบสิทธิ์ */

);

){

);

location.href="login.html";

}

</script>



<div class="container">

<h1>➕ เพิ่มสต๊อกสินค้า</h1>

<button
class="back"
onclick="location.href='remain.html'">

⬅ กลับหน้าสต๊อก

</button>

<br><br>

<select id="code">

<option value="">
-- เลือกรหัสสินค้า --
</option>

</select>

<input
id="qty"
type="number"
placeholder="จำนวนเพิ่ม">

<button
id="saveBtn"
class="save"
onclick="saveStock()">

บันทึก

</button>


<h2>
📜 ประวัติการเพิ่มสต๊อก
</h2>


  <div style="
display:flex;
align-items:center;
gap:15px;
margin:15px 0;
flex-wrap:nowrap;
">

<div>

📅 เดือน:

<select id="monthFilter">

<option value="">ทั้งหมด</option>
<option value="01">มกราคม</option>
<option value="02">กุมภาพันธ์</option>
<option value="03">มีนาคม</option>
<option value="04">เมษายน</option>
<option value="05">พฤษภาคม</option>
<option value="06">มิถุนายน</option>
<option value="07">กรกฎาคม</option>
<option value="08">สิงหาคม</option>
<option value="09">กันยายน</option>
<option value="10">ตุลาคม</option>
<option value="11">พฤศจิกายน</option>
<option value="12">ธันวาคม</option>

</select>

</div>

<div>

📆 ปี:

<select id="yearFilter">

<option value="">ทั้งหมด</option>
<option value="2569">2569</option>
<option value="2570">2570</option>
<option value="2571">2571</option>

</select>

</div>

<input
type="text"
id="search"
placeholder="🔍 ค้นหารหัส หรือ ชื่อ สป."
style="
width:300px;
padding:8px;
margin-left:auto;
">

</div>



<table>

<thead>

<tr>

<th>วันที่</th>
<th>เวลา</th>
<th>รหัส</th>
  <th>ชื่อ สป.</th>
<th>จำนวน</th>
<th>ผู้เพิ่ม</th>

</tr>

</thead>

<tbody id="history">

</tbody>

</table>

</div>

<script>

const API=
"https://script.google.com/macros/s/AKfycbzY5rcaEq3kviu0iglxS61jAiCgNAuRrUcpwpzVuxkKYjLQkFXSL63YcO6-QUiWap0l/exec";
let isSaving=false;

async function loadProducts(){

const res=
await fetch(
API+"?type=products"
);

const data=
await res.json();

async function loadProducts(){

const res=
await fetch(
API+"?type=products"
);

const data=
await res.json();

const select=
document.getElementById("code");

for(let i=1;i<data.length;i++){

select.innerHTML+=`

<option value="${data[i][0]}">

${data[i][0]} -
${data[i][1]}

</option>

`;

}

}



async function saveStock(){

if(isSaving) return;

const code=
document.getElementById("code").value;

const qty=
document.getElementById("qty").value;

if(!code || !qty){

alert("กรุณากรอกข้อมูล");
return;

}

isSaving=true;

const btn=
document.getElementById(
"saveBtn"
);

btn.disabled=true;

btn.innerHTML=
"กำลังบันทึก...";

const auth=
JSON.parse(
localStorage.getItem("auth")
);

try{

const res=
await fetch(API,{

method:"POST",

body:JSON.stringify({

action:"addstock",
code:code,
qty:Number(qty),
user:auth.user

})

});

const result=
(await res.text()).trim();

if(result=="OK"){

alert(
"✅ เพิ่มสต๊อกสำเร็จ"
);

location.reload();

}else{

alert(
"❌ บันทึกไม่สำเร็จ"
);

isSaving=false;

btn.disabled=false;

btn.innerHTML=
"บันทึก";

}

}catch(error){

console.log(error);

alert(
"❌ เกิดข้อผิดพลาด"
);

isSaving=false;

btn.disabled=false;

btn.innerHTML=
"บันทึก";

}

}



async function loadHistory(){

const res=
await fetch(
API+"?type=addhistory"
);

const data=
await res.json();

const table=
document.getElementById("history");

table.innerHTML="";

for(let i=1;i<data.length;i++){

table.innerHTML+=`

<tr>

<td>${data[i][0]}</td>
<td>${data[i][1]}</td>
<td>${data[i][2]}</td>
<td>${data[i][3]}</td>
<td>${data[i][4]}</td>
<td>${data[i][5]}</td>

</tr>

`;

}

filterDate();

}
function searchTable(){

const keyword=
document
.getElementById("search")
.value
.toLowerCase();

const rows=
document.querySelectorAll(
"#history tr"
);

rows.forEach(function(row){

const text=
row.innerText.toLowerCase();

if(
text.includes(keyword)
){

row.style.display="";

}else{

row.style.display="none";

}

});

}



function filterDate(){

const month=
document
.getElementById("monthFilter")
.value;

const year=
document
.getElementById("yearFilter")
.value;

const rows=
document.querySelectorAll(
"#history tr"
);

rows.forEach(function(row){

const date=
row.cells[0]
.textContent;

const parts=
date.split("/");

if(parts.length<3)return;

const rowMonth=
parts[1];

const rowYear=
String(
Number(parts[2])+543
);

if(

(month==="" || rowMonth===month)

&&

(year==="" || rowYear===year)

){

row.style.display="";

}else{

row.style.display="none";

}

});

}
  
loadProducts();
loadHistory();

const now=
new Date();

const currentMonth=
String(
now.getMonth()+1
).padStart(2,"0");

const currentYear=
String(
now.getFullYear()+543
);

document.getElementById(
"monthFilter"
).value=currentMonth;

document.getElementById(
"yearFilter"
).value=currentYear;

filterDate();

document
.getElementById("search")
.addEventListener(
"keyup",
searchTable
);



</script>

</body>
</html>
