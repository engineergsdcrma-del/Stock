<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบคลังรายการ สป.กยย.สบร.รร.จปร.</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:
linear-gradient(
135deg,
#1f3a1f,
#2e5a2e,
#4b6f44
);

min-height:100vh;
color:white;
}

.header{
background:#2e4d2c;
color:white;
padding:25px;
text-align:center;
border-bottom:3px solid #8bc34a;
}

.header h1{
font-size:32px;
}

.container{
max-width:1200px;
margin:auto;
padding:30px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
margin-bottom:40px;
}

.stock-card{
background:rgba(255,255,255,.1);
backdrop-filter:blur(8px);
color:white;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.stock-card h2{
margin-bottom:15px;
font-size:28px;
}

.item{

background:rgba(255,255,255,.15);

padding:10px;
margin-top:10px;
border-radius:10px;

color:white;

font-weight:bold;

}

.login-box{

width:100%;
max-width:400px;

margin:50px auto;

background:
rgba(255,255,255,.12);

backdrop-filter:blur(10px);

padding:25px;

border-radius:20px;

}

background:
rgba(255,255,255,.12);

backdrop-filter:blur(10px);

}

background:
rgba(255,255,255,.1);

backdrop-filter:blur(10px);

color:white;
}

.login-box h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#4caf50;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#66bb6a;
}

.logo-header{

display:flex;
justify-content:center;
align-items:center;
gap:30px;
margin-bottom:20px;
flex-wrap:wrap;

}

.logo-header{

display:flex;
justify-content:center;
align-items:center;
gap:25px;
margin:15px auto 30px auto;

}

.logo-header img{

height:120px;
width:auto;
object-fit:contain;

}

.logo-header img:hover{

transform:scale(1.1);

}

  @media(max-width:768px){

.container{

padding:15px;

}

.header h1{

font-size:20px;

}

.dashboard{

grid-template-columns:1fr;

}

.logo-header{

gap:10px;

}

.logo-header img{

height:70px;

}

.login-box{

margin:auto;

}

}


  .logo-header{

display:flex;
justify-content:center;
align-items:center;
gap:20px;
margin-bottom:20px;

}

.logo-header img{

height:90px;
width:auto;

}
  
</style>

</head>

<body>

<div class="logo-header">

<img src="./logo1.jpg">

<img src="./logo2.jpg">

<img src="./logo3.jpg">

</div>
  

<h1>
📦 ระบบคลังรายการ สป.กยย.สบร.รร.จปร.
</h1>

</div>


<div class="container">

<div class="dashboard">

<div class="stock-card">
<h2>🏢 บก.</h2>

<div class="item">
สายไฟ<br>
คงเหลือ 18 เส้น
</div>

<div class="item">
หลอดไฟ<br>
คงเหลือ 5 ดวง
</div>

</div>

<div class="stock-card">
<h2>🏠 อาคาร</h2>

<div class="item">
ไม้กวาดทางมะพร้าว<br>
คงเหลือ 4 อัน
</div>

</div>

<div class="stock-card">
<h2>⚡ ไฟฟ้า</h2>

<div class="item">
สีทาบ้าน RED<br>
คงเหลือ 5 ถัง
</div>

</div>

<div class="stock-card">
<h2>🚰 ประปา</h2>

<div class="item">
น้ำเสีย<br>
คงเหลือ 1 ถัง
</div>

</div>

<div class="stock-card">
<h2>💧 น้ำเสีย</h2>

<div class="item">
ประปา<br>
คงเหลือ 2 อัน
</div>

</div>

</div>

<div class="login-box">

<h2>
🔐 Login เฉพาะเจ้าหน้าที่
</h2>

<input
type="text"
id="user"
placeholder="Username">

<input
type="password"
id="pass"
placeholder="Password">

<button onclick="login()">
เข้าสู่ระบบ
</button>

</div>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbzY5rcaEq3kviu0iglxS61jAiCgNAuRrUcpwpzVuxkKYjLQkFXSL63YcO6-QUiWap0l/exec";

async function login(){

const user=
document.getElementById("user").value.trim();

const pass=
document.getElementById("pass").value.trim();

if(user==="" || pass===""){

alert(
"กรุณากรอก Username และ Password"
);

return;

}

try{

const res=
await fetch(API,{

method:"POST",

body:JSON.stringify({

action:"login",
username:user,
password:pass

})

});

const result=
(await res.text()).trim();

console.log(result);

if(result=="OK"){

localStorage.setItem(
"auth",
JSON.stringify({

login:true,
user:user

})
);

window.location.href=
"index.html";

}else{

alert(
"⛔ รหัสไม่ถูกต้อง\n\nคุณไม่ใช่เจ้าหน้าที่"
);

}

}catch(error){

console.log(error);

alert(
"ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้"
);

}

}

</script>

</body>
</html>
