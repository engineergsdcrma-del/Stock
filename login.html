<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ระบบคลังรายการ สป.กยย.สบร.รร.จปร.</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

.header{

background:#1976d2;
color:white;
padding:25px;
text-align:center;

}

.header h1{

font-size:32px;

}

.header p{

margin-top:10px;

}

/* Dashboard */

.dashboard{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
max-width:900px;
margin:40px auto;

}

.card{

height:150px;
border-radius:15px;
color:white;
padding:25px;
box-shadow:0 5px 15px rgba(0,0,0,.15);

}

.blue{
background:linear-gradient(
135deg,
#2196f3,
#1565c0
);
}

.green{
background:linear-gradient(
135deg,
#4caf50,
#2e7d32
);
}

.orange{
background:linear-gradient(
135deg,
#ff9800,
#ef6c00
);
}

.red{
background:linear-gradient(
135deg,
#f44336,
#c62828
);
}

.card h2{

margin-bottom:15px;

}

/* Login */

.login-box{

width:350px;
background:white;
margin:40px auto;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.15);

}

.login-box h2{

text-align:center;
margin-bottom:20px;

}

input{

width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ccc;
border-radius:8px;

}

button{

width:100%;
padding:12px;
background:#1976d2;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;

}

button:hover{

background:#1565c0;

}

</style>

</head>

<body>

<div class="header">

<h1>
📦 ระบบคลังรายการ สป.กยย.สบร.รร.จปร.
</h1>

<p>
ระบบบริหารจัดการคลังสินค้า
</p>

</div>


<div class="dashboard">

<div class="card blue">

<h2>📦 สต๊อกสินค้า</h2>

<p>ตรวจสอบรายการสินค้า</p>

</div>

<div class="card green">

<h2>📋 เบิกสินค้า</h2>

<p>ตรวจสอบรายการเบิก</p>

</div>

<div class="card orange">

<h2>🏢 หน่วยงาน</h2>

<p>จัดการข้อมูลหน่วยงาน</p>

</div>

<div class="card red">

<h2>🔐 เฉพาะเจ้าหน้าที่</h2>

<p>จำกัดสิทธิ์การใช้งาน</p>

</div>

</div>


<div class="login-box">

<h2>
🔐 Login เฉพาะเจ้าหน้าที่
</h2>

<input
type="text"
id="user"
placeholder="Username">

<input
type="password"
id="pass"
placeholder="Password">

<button onclick="login()">

เข้าสู่ระบบ

</button>

</div>

<script>

const API=
"https://script.google.com/macros/s/AKfycbzY5rcaEq3kviu0iglxS61jAiCgNAuRrUcpwpzVuxkKYjLQkFXSL63YcO6-QUiWap0l/exec";

async function login(){

const user=
document.getElementById("user").value.trim();

const pass=
document.getElementById("pass").value.trim();

const res=await fetch(API,{

method:"POST",

body:JSON.stringify({

action:"login",
username:user,
password:pass

})

});

const result=
(await res.text()).trim();

if(result=="OK"){

localStorage.setItem(
"auth",
JSON.stringify({
login:true,
user:user
})
);

location.href="index.html";

}else{

alert(
"⛔ รหัสไม่ถูกต้อง\nคุณไม่ใช่เจ้าหน้าที่"
);

}

}

</script>

</body>
</html>
