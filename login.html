<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ระบบคลังรายการ สป.กยย.สบร.รร.จปร.</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

.header{
background:#1976d2;
color:white;
padding:25px;
text-align:center;
}

.header h1{
font-size:32px;
}

.container{
max-width:1200px;
margin:auto;
padding:30px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
margin-bottom:40px;
}

.stock-card{

background:white;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.1);

}

.stock-card h2{
margin-bottom:15px;
font-size:28px;
}

.item{
background:#f4f6f9;
padding:10px;
margin-top:10px;
border-radius:10px;
}

.login-box{

width:350px;
background:white;
padding:30px;
margin:auto;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.15);

}

.login-box h2{

text-align:center;
margin-bottom:20px;

}

input{

width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ccc;
border-radius:8px;

}

button{

width:100%;
padding:12px;
background:#1976d2;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;

}

</style>

</head>

<body>

<div class="header">

<h1>
📦 ระบบคลังรายการ สป.กยย.สบร.รร.จปร.
</h1>

</div>

<div class="container">

<div class="dashboard">

<div class="stock-card">

<h2>🏢 บก.</h2>

<div class="item">
สายไฟ<br>
คงเหลือ 18 เส้น
</div>

<div class="item">
หลอดไฟ<br>
คงเหลือ 5 ดวง
</div>

</div>


<div class="stock-card">

<h2>🏠 อาคาร</h2>

<div class="item">
ไม้กวาดทางมะพร้าว<br>
คงเหลือ 4 อัน
</div>

</div>


<div class="stock-card">

<h2>⚡ ไฟฟ้า</h2>

<div class="item">
สีทาบ้าน RED<br>
คงเหลือ 5 ถัง
</div>

</div>


<div class="stock-card">

<h2>🚰 ประปา</h2>

<div class="item">
น้ำเสีย<br>
คงเหลือ 1 ถัง
</div>

</div>

<div class="stock-card">

<h2>💧 น้ำเสีย</h2>

<div class="item">
ประปา<br>
คงเหลือ 2 อัน
</div>

</div>

</div>


<div class="login-box">

<h2>
🔐 Login เฉพาะเจ้าหน้าที่
</h2>

<input
type="text"
id="user"
placeholder="Username">

<input
type="password"
id="pass"
placeholder="Password">

<button onclick="login()">
เข้าสู่ระบบ
</button>

</div>

</div>


<script>

<script>

const API =
"https://script.google.com/macros/s/AKfycbzY5rcaEq3kviu0iglxS61jAiCgNAuRrUcpwpzVuxkKYjLQkFXSL63YcO6-QUiWap0l/exec";

async function login(){

localStorage.removeItem("auth");

const user=
document.getElementById("user").value.trim();

const pass=
document.getElementById("pass").value.trim();

if(user=="" || pass==""){

alert("กรุณากรอก Username และ Password");
return;

}

try{

const res = await fetch(API,{

method:"POST",

body:JSON.stringify({

action:"login",
username:user,
password:pass

})

});

const result=
(await res.text()).trim();

if(result==="OK"){

localStorage.setItem(
"auth",
JSON.stringify({

login:true,
user:user

})
);

location.href="index.html";

}else{

localStorage.removeItem("auth");

alert(
"⛔ รหัสไม่ถูกต้อง\n\nคุณไม่ใช่เจ้าหน้าที่"
);

document.getElementById("user").value="";
document.getElementById("pass").value="";

}

}catch(err){

localStorage.removeItem("auth");

alert("เชื่อมต่อระบบไม่ได้");

}

}

</script>

</body>
</html>
