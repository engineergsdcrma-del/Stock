<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบคลังรายการ สป.กยย.สบร.รร.จปร.</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:
linear-gradient(
135deg,
#1f3a1f,
#2e5a2e,
#4b6f44
);

min-height:100vh;
color:white;
}

.header{
background:#2e4d2c;
color:white;
padding:25px;
text-align:center;
border-bottom:3px solid #8bc34a;
}

.header h1{

font-size:38px;
text-align:center;
margin:15px auto;
width:100%;

}

.mobile-break{
display:none;
}

@media(max-width:768px){

.mobile-break::after{
content:"";
display:block;
}

}
  
.container{
max-width:1200px;
margin:auto;
padding:30px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
margin-bottom:40px;
}

.stock-card{
background:rgba(255,255,255,.1);
backdrop-filter:blur(8px);
color:white;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.stock-card h2{
margin-bottom:15px;
font-size:28px;
}

  .dashboard-summary h2{

font-size:30px;
text-align:center;
margin-bottom:20px;

}
  
.dashboard-summary{

display:flex;
justify-content:center;
margin-bottom:40px;

}

.dashboard-summary .stock-card{

width:90%;
max-width:550px;

padding:25px 35px;

text-align:left;

margin:auto;

}

  #alertBox{

width:fit-content;
margin:0 auto;
text-align:left;

}



#alertBox{

color:#ffeb3b;
font-weight:bold;
line-height:2;
margin-top:15px;

}
  
.item{

background:rgba(255,255,255,.15);

padding:10px;
margin-top:10px;
border-radius:10px;

color:white;

font-weight:bold;

}

.login-box{

width:100%;
max-width:400px;

margin:50px auto;

background:
rgba(255,255,255,.12);

backdrop-filter:blur(10px);

padding:25px;

border-radius:20px;

}


.login-box h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#4caf50;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#66bb6a;
}

.logo-header{

display:flex;
justify-content:center;
align-items:center;
gap:25px;
margin:15px auto 30px auto;

}

.logo-header img{

height:90px;
width:auto;
object-fit:contain;

}

.logo-header img:hover{

transform:scale(1.1);

}

  @media(max-width:768px){

.container{

padding:15px;

}

.header h1{

font-size:28px;
line-height:1.6;
text-align:center;



}

.dashboard{

grid-template-columns:1fr;

}

.mobile-break{
display:block;
}
    
.logo-header{

gap:10px;

}

.logo-header img{

height:70px;

}

.login-box{

margin:auto;

}

}


 
  
</style>

</head>

<body>

<div class="header">

<div class="logo-header">

<img src="./p1.png">
<img src="./p2.png">
<img src="./p3.png">

</div>

<h1>
📦 ระบบคลังรายการ สป.
<span class="mobile-break"></span>
กยย.สบร.รร.จปร.
</h1>
</div>

<div class="dashboard-summary">

<div class="stock-card">

<h2>🚨 แจ้งเตือนของใกล้หมด</h2>

<div id="alertBox">

ไม่มีรายการแจ้งเตือน

</div>

</div>

</div>

  
<div class="container">
<div class="dashboard" id="dashboard">

</div>




<div class="login-box">

<h2>
🔐 Login เฉพาะเจ้าหน้าที่
</h2>

<input
type="text"
id="user"
placeholder="Username">

<input
type="password"
id="pass"
placeholder="Password">

<button onclick="login()">
เข้าสู่ระบบ
</button>

</div>

</div>


<script>

const API =
"https://script.google.com/macros/s/AKfycbzY5rcaEq3kviu0iglxS61jAiCgNAuRrUcpwpzVuxkKYjLQkFXSL63YcO6-QUiWap0l/exec";


// =========================
// โหลด Dashboard
// =========================

async function loadDashboard(){

try{

const res =
await fetch(API+"?type=products");

const data =
await res.json();

let alertText="";

for(let i=1;i<data.length;i++){

const remain =
Number(data[i][3]);

if(remain<=5){

alertText +=
"⚠️ "+
data[i][1]+
" เหลือ "+
remain+
" ชิ้น<br>";

}

}

document.getElementById(
"alertBox"
).innerHTML=

alertText ||
"✅ ไม่มีรายการแจ้งเตือน";

}catch(error){

console.log(
"Dashboard Error:",
error
);

}

}



// =========================
// Login
// =========================

async function login(){

const user =
document.getElementById(
"user"
).value.trim();

const pass =
document.getElementById(
"pass"
).value.trim();


if(
user==="" ||
pass===""
){

alert(
"กรุณากรอก Username และ Password"
);

return;

}


try{

const res =
await fetch(API,{

method:"POST",

body:JSON.stringify({

action:"login",
username:user,
password:pass

})

});

const result =
(await res.text()).trim();


if(result==="OK"){

localStorage.setItem(

"auth",

JSON.stringify({

login:true,
user:user

})

);

window.location.href=
"index.html";

}else{

alert(
"⛔ รหัสไม่ถูกต้อง"
);

}

}catch(error){

console.log(error);

alert(
"ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้"
);

}

}



// =========================
// เริ่มโหลด
// =========================

window.onload=()=>{

loadDashboard();

};

</script>


</body>
</html>
