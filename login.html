<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Login Stock System</title>

<style>

body{
  font-family:Arial,sans-serif;
  background:#f4f6f9;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

.login-box{
  width:350px;
  background:white;
  padding:30px;
  border-radius:12px;
  box-shadow:0 4px 20px rgba(0,0,0,0.15);
}

h2{
  text-align:center;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border:1px solid #ccc;
  border-radius:8px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:12px;
  background:#2196f3;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
}

button:hover{
  background:#1976d2;
}

</style>

</head>

<body>

<div class="login-box">

<h2>🔐 Login Stock System</h2>

<input
type="text"
id="user"
placeholder="Username">

<input
type="password"
id="pass"
placeholder="Password">

<button onclick="login()">
เข้าสู่ระบบ
</button>

</div>

<script>

function login(){

  const user =
  document.getElementById("user").value;

  const pass =
  document.getElementById("pass").value;

  if(user==="admin" && pass==="1234"){

    localStorage.setItem("login","ok");

    location.href="addstock.html";

  }else{

    alert("Username หรือ Password ไม่ถูกต้อง");

  }

}

</script>

</body>
</html>
