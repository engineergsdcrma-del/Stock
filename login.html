<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Stock System</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f6f9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.login-box{
width:350px;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 4px 20px rgba(0,0,0,.15);
}

h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#1976d2;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#1565c0;
}

</style>
</head>

<body>

<div class="login-box">

<h2>🔐 เฉพาะเจ้าหน้าที่</h2>

<input
type="text"
id="user"
placeholder="Username">

<input
type="password"
id="pass"
placeholder="Password">

<button onclick="login()">
เข้าสู่ระบบ
</button>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbzY5rcaEq3kviu0iglxS61jAiCgNAuRrUcpwpzVuxkKYjLQkFXSL63YcO6-QUiWap0l/exec";

async function login(){

const user=
document.getElementById("user").value.trim();

const pass=
document.getElementById("pass").value.trim();

if(user==="" || pass===""){

alert("กรุณากรอก Username และ Password");
return;

}

try{

const res=await fetch(API,{
method:"POST",
body:JSON.stringify({

action:"login",
username:user,
password:pass

})
});

const result=
(await res.text()).trim();

if(result==="OK"){

localStorage.clear();

localStorage.setItem(
"auth",
JSON.stringify({
login:true,
user:user
})
);

location.href="index.html";

}else{

const popup=
document.createElement("div");

popup.innerHTML=`
<div style="
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,.3);
text-align:center;
z-index:9999;
width:300px;
">

<h2 style="color:red;">
⛔ เข้าระบบไม่ได้
</h2>

<p>
รหัสไม่ถูกต้อง<br>
คุณไม่ใช่เจ้าหน้าที่
</p>

<button onclick="this.parentElement.parentElement.remove()"
style="
padding:10px 20px;
background:#1976d2;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
">
ตกลง
</button>

</div>
`;

document.body.appendChild(popup);

document.getElementById("user").value="";
document.getElementById("pass").value="";
document.getElementById("user").focus();

}

}catch(error){

alert("ไม่สามารถเชื่อมต่อระบบได้");

}

}

</script>

</body>
</html>
